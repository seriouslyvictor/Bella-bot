# Production stack consumed directly by Coolify. It deliberately publishes no
# host ports: Coolify may route a domain to evolution-go:8080, while Bella and
# PostgreSQL stay reachable only by their Compose service names. Every service
# is self-contained: Coolify deploys from a build-container checkout the host
# daemon cannot see, so no config or bind mount may reference repository files.
services:
  postgres:
    # postgres:15-alpine (digest-pinned in deploy/postgres/Dockerfile) plus the
    # baked-in database initializer.
    image: bella/postgres:15-alpine-init1
    build:
      context: deploy/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      BELLA_DB_PASSWORD: ${BELLA_DB_PASSWORD:?Set BELLA_DB_PASSWORD}
      EVOLUTION_DB_PASSWORD: ${EVOLUTION_DB_PASSWORD:?Set EVOLUTION_DB_PASSWORD}
      EVOLUTION_DB_CONNECTION_LIMIT: ${EVOLUTION_DB_CONNECTION_LIMIT:-30}
      EVOLUTION_DB_IDLE_SESSION_TIMEOUT: ${EVOLUTION_DB_IDLE_SESSION_TIMEOUT:-5min}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${BELLA_DB_PASSWORD}" psql -h 127.0.0.1 -U bella -d bella -c 'SELECT 1' >/dev/null &&
          PGPASSWORD="$${EVOLUTION_DB_PASSWORD}" psql -h 127.0.0.1 -U evolution -d evogo_auth -c 'SELECT 1' >/dev/null &&
          PGPASSWORD="$${EVOLUTION_DB_PASSWORD}" psql -h 127.0.0.1 -U evolution -d evogo_users -c 'SELECT 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  evolution-go:
    # Bella-owned 0.7.2 backport containing only upstream PR #117's three commits.
    image: bella/evolution-go:0.7.2-pr117-0328955
    build:
      context: .
      dockerfile: deploy/evolution/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: ${EVOLUTION_GLOBAL_API_KEY:?Set EVOLUTION_GLOBAL_API_KEY}
      POSTGRES_AUTH_DB: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?Set EVOLUTION_DB_PASSWORD}@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?Set EVOLUTION_DB_PASSWORD}@postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: ${EVOLUTION_DATABASE_SAVE_MESSAGES:-false}
      # These are the names read by the Evolution GO binary. Its example Compose file
      # still uses the older WADEBUG/LOGTYPE spellings.
      DEBUG_ENABLED: ${EVOLUTION_DEBUG_LEVEL:-INFO}
      LOG_TYPE: console
      GIN_MODE: release
      # Bella needs the message envelope/type, not downloaded media bytes.
      WEBHOOK_FILES: "false"
      CONNECT_ON_STARTUP: ${EVOLUTION_CONNECT_ON_STARTUP:-true}
      OS_NAME: ${EVOLUTION_OS_NAME:-Evolution GO}
      WEBHOOK_URL: ""
      AMQP_URL: ""
      AMQP_GLOBAL_ENABLED: "false"
      NATS_URL: ""
      NATS_GLOBAL_ENABLED: "false"
      MINIO_ENABLED: "false"
      EVENT_IGNORE_GROUP: "true"
      EVENT_IGNORE_STATUS: "true"
      QRCODE_MAX_COUNT: ${EVOLUTION_QRCODE_MAX_COUNT:-5}
      CHECK_USER_EXISTS: "true"
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/server/ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s

  bella:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Service DNS is owned by this Compose project in local and Coolify.
      EVOLUTION_URL: http://evolution-go:8080
      BELLA_INTERNAL_URL: http://bella:8000
      BELLA_DATABASE_URL: postgresql://bella:${BELLA_DB_PASSWORD:?Set BELLA_DB_PASSWORD}@postgres:5432/bella
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?Set EVOLUTION_API_KEY to the instance token}
      # Evolution GO identifies the instance by EVOLUTION_API_KEY. Bella
      # retains this header for compatibility, but the value is not consulted.
      EVOLUTION_INSTANCE_ID: ${EVOLUTION_INSTANCE_ID:-bella}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY}
      GEMINI_ROUTER_MODEL: ${GEMINI_ROUTER_MODEL:-gemini-3.8-flash}
      GEMINI_AGENT_MODEL: ${GEMINI_AGENT_MODEL:-gemini-3.8-flash}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_CONTACT: ${ADMIN_CONTACT:?Set ADMIN_CONTACT to the owner WhatsApp number}
      BELLA_DISPLAY_NAME: ${BELLA_DISPLAY_NAME:-Nova}
      HUMAN_CONTACT_REPLY: ${HUMAN_CONTACT_REPLY:-}
      ALLOWED_REPLY_URLS: ${ALLOWED_REPLY_URLS:-}
      APOSTILA_PATH: ${APOSTILA_PATH:-/app/content/apostila.pdf}
      RATE_LIMIT_MAX_MESSAGES: ${RATE_LIMIT_MAX_MESSAGES:-10}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      TAKEOVER_PAUSE_SECONDS: ${TAKEOVER_PAUSE_SECONDS:-3600}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      evolution-go:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s

volumes:
  postgres_data:
