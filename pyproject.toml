[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bella-bot"
version = "0.1.0"
description = "Bella — WhatsApp course concierge for the SENAI Generative AI course"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.11",
]

# Only `bella` is an installable package. Without this, setuptools' flat-
# layout auto-discovery sees `content/` sitting next to it at repo root and
# refuses to build ("Multiple top-level packages discovered") — which the
# Dockerfile's `pip install .` needs to work.
[tool.setuptools.packages.find]
include = ["bella*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["bella", "tests"]
