# =====================================================================
# RESPOSTAS PRONTAS (Canned Replies)
# =====================================================================
# Estas mensagens são enviadas VERBATIM — sem passar por nenhum modelo
# (ver docs/adr/0002). Edite os textos à vontade; mantenha as chaves.
#
# refusals: recusas para mensagens fora de escopo. A Bella sorteia uma
#   variante da lista do idioma detectado (pt é o padrão).
# media_reply: resposta a áudios, imagens, figurinhas e documentos.
# rate_limit_reply: enviada UMA vez quando o usuário excede o limite.
# error_reply: enviada quando ocorre uma falha interna (a Bella nunca
#   responde sem passar pelas proteções; na dúvida, pede para tentar de novo).
# =====================================================================

refusals:
  pt:
    - >-
      Eu sou a Bella, assistente do curso de IA Generativa do SENAI 😊 Só
      consigo ajudar com dúvidas sobre o curso, a apostila e a inscrição.
      Quer saber alguma coisa sobre o curso?
    - >-
      Essa eu vou ficar te devendo! 😅 Eu fui criada só para falar sobre o
      curso "IA Generativa Aplicada a Programação" do SENAI — posso te contar
      sobre o conteúdo, as datas ou como se inscrever.
    - >-
      Hmm, isso foge do meu assunto 🙈 Eu cuido apenas do curso de IA
      Generativa do SENAI: conteúdo, apostila e inscrições. Como posso te
      ajudar com isso?
  en:
    - >-
      I'm Bella, the assistant for SENAI's Generative AI course 😊 I can only
      help with questions about the course, its workbook, and enrollment.
      Anything you'd like to know about the course? (The course is taught in
      Portuguese.)
  es:
    - >-
      ¡Soy Bella, la asistente del curso de IA Generativa del SENAI! 😊 Solo
      puedo ayudar con dudas sobre el curso, el material y la inscripción.
      ¿Quieres saber algo sobre el curso? (El curso se imparte en portugués.)

media_reply: >-
  Por enquanto eu só entendo mensagens de texto 😊 Pode escrever a sua dúvida
  sobre o curso que eu respondo!

rate_limit_reply: >-
  Opa, muitas mensagens de uma vez! 😅 Me dá um minutinho e continuamos a
  conversa, combinado?

human_contact_intro: "Contato humano:"

apostila_soon_reply: >-
  A apostila ainda esta sendo finalizada e vai estar disponivel em breve.
  Enquanto isso, pode me perguntar sobre o conteudo que eu te ajudo por aqui!

apostila_caption: >-
  Aqui esta a apostila do curso! Espero que aproveite a leitura.

apostila_error_reply: >-
  Desculpe, nao consegui enviar a apostila agora. Pode tentar novamente em
  alguns instantes? Enquanto isso, posso responder suas duvidas sobre o conteudo.

translations:
  en:
    media_reply: >-
      For now I can only understand text messages. Please type your question!
      The course itself is taught in Portuguese.
    rate_limit_reply: >-
      That's a lot of messages at once! Give me a minute and we can continue.
      The course itself is taught in Portuguese.
    error_reply: >-
      I had a technical problem on my side. Please try again in a moment.
    apostila_soon_reply: >-
      The workbook is still being finalized and will be available soon. In the
      meantime, ask me anything about its content. The course is taught in Portuguese.
    apostila_caption: >-
      Here is the course workbook! The course itself is taught in Portuguese.
    apostila_error_reply: >-
      Sorry, I could not send the workbook right now. Please try again shortly.
      The course itself is taught in Portuguese.
    human_contact_intro: >-
      Of course! Here is the human contact. The course is taught in Portuguese:
  es:
    media_reply: >-
      Por ahora solo entiendo mensajes de texto. Escribe tu pregunta, por favor.
      El curso se imparte en portugues.
    rate_limit_reply: >-
      Son muchos mensajes a la vez. Dame un minuto y continuamos. El curso se
      imparte en portugues.
    error_reply: >-
      Tuve un problema tecnico. Intentalo de nuevo en unos instantes.
    apostila_soon_reply: >-
      El cuaderno todavia se esta finalizando y estara disponible pronto.
      Mientras tanto, preguntame por su contenido. El curso se imparte en portugues.
    apostila_caption: >-
      Aqui tienes el cuaderno del curso. El curso se imparte en portugues.
    apostila_error_reply: >-
      Lo siento, no pude enviar el cuaderno ahora. Intentalo de nuevo en breve.
      El curso se imparte en portugues.
    human_contact_intro: >-
      Claro. Este es el contacto humano. El curso se imparte en portugues:

error_reply: >-
  Tive um probleminha técnico aqui do meu lado 🙈 Pode enviar sua mensagem de
  novo em instantes?
