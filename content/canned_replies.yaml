# =====================================================================
# RESPOSTAS PRONTAS (Canned Replies) — NOVA
# =====================================================================
# Mensagens enviadas sem passar por modelos de IA (proteção anti-injeção).
# Identidade: Nova, assistente técnica de suporte e feedback de aplicações.
# =====================================================================

refusals:
  pt:
    - >-
      Olá! Eu sou a Nova, assistente técnica das nossas aplicações, como o
      Report Generator 9000 😊 Consigo ajudar com suporte, dúvidas de uso ou
      coleta de feedback sobre nossos sistemas. Como posso te ajudar com o Report Generator?
    - >-
      Essa eu vou ficar te devendo! 😅 Fui criada para apoiar usuários com
      dúvidas, funcionamento e sugestões sobre nossos sistemas (como o
      Report Generator 9000). Quer saber mais sobre a geração de relatórios?
    - >-
      Hmm, isso foge do meu escopo 🙈 Eu cuido do suporte e feedback das
      nossas aplicações, como o Report Generator 9000. Posso te ajudar com
      alguma dúvida sobre o sistema ou relatórios?
  en:
    - >-
      Hello! I'm Nova, the technical assistant for our applications, including
      Report Generator 9000 😊 I can help with troubleshooting, how-tos, and
      collecting feedback about our apps.
  es:
    - >-
      ¡Hola! Soy Nova, la asistente técnica de nuestras aplicaciones, incluyendo
      Report Generator 9000 😊 Puedo ayudarte con soporte, dudas técnicas y
      feedback sobre nuestros sistemas.

media_reply: >-
  Por enquanto eu só consigo processar mensagens de texto 😊 Pode descrever
  sua dúvida, problema ou sugestão por escrito que eu te ajudo!

rate_limit_reply: >-
  Opa, muitas mensagens de uma vez só! 😅 Me dá um minutinho para processar e já
  continuamos nossa conversa, combinado?

human_contact_intro: "Contato humano:"

# Sent when a user asks for a person but no human contact is configured.
# Without it the handoff branch had nothing to say and sent an empty
# message; the team is still notified either way.
no_contact_reply: >-
  Claro! Já avisei nossa equipe técnica sobre a sua solicitação 🙌 Alguém do
  time vai te responder por aqui assim que possível.

greeting_reply: >-
  Olá! Eu sou a Nova, assistente técnica de aplicações 😊 Posso te ajudar com dúvidas e suporte técnico do Report Generator 9000 ou registrar sugestões e relatos de problemas. Como posso te ajudar hoje?

error_reply: >-
  Tive um probleminha técnico por aqui 🙈 Poderia enviar sua mensagem novamente
  em alguns instantes?

translations:
  en:
    media_reply: >-
      For now I can only process text messages. Please type your question, issue, or feedback!
    rate_limit_reply: >-
      That's a lot of messages at once! Please give me a moment and we can continue.
    error_reply: >-
      I encountered a technical issue on my end. Please try again in a moment.
    human_contact_intro: >-
      Here is the human contact:
    no_contact_reply: >-
      Sure! I've let our technical team know about your request. Someone will get back to you here as soon as possible.
    greeting_reply: >-
      Hello! I'm Nova, application technical assistant 😊 I can help with Report Generator 9000 support or register your feedback and bug reports. How can I help you today?
  es:
    media_reply: >-
      Por ahora solo puedo procesar mensajes de texto. Por favor, escribe tu consulta, problema o sugerencia.
    rate_limit_reply: >-
      Son muchos mensajes a la vez. Dame un minuto y continuamos.
    error_reply: >-
      Tuve un problema técnico. Inténtalo de nuevo en unos instantes.
    human_contact_intro: >-
      Claro, este es el contacto humano:
    no_contact_reply: >-
      ¡Claro! Ya avisé a nuestro equipo técnico sobre tu solicitud. Alguien te responderá por aquí lo antes posible.
    greeting_reply: >-
      ¡Hola! Soy Nova, asistente técnica de aplicaciones 😊 Puedo ayudarte con dudas del Report Generator 9000 o registrar tus comentarios y reportes de errores. ¿En qué puedo ayudarte hoy?
